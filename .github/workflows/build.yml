name: Build SmartMF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          
      - name: Build Windows Executable
        run: |
          $SITEPACKAGES = python -c "import site; print(site.getsitepackages()[1])"
          pyinstaller --noconfirm --onefile --windowed --name "SmartMF" --add-data "$SITEPACKAGES\customtkinter;customtkinter/" --copy-metadata imageio --copy-metadata docx2pdf --copy-metadata google-genai --copy-metadata pillow-heif main.py
          
      - name: Upload Windows App
        uses: actions/upload-artifact@v3
        with:
          name: SmartMF-Windows-Standalone
          path: dist/SmartMF.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          
      - name: Build Mac App
        run: |
          SITEPACKAGES=$(python -c 'import site; print(site.getsitepackages()[0])')
          pyinstaller --noconfirm --windowed --name "SmartMF" --add-data "$SITEPACKAGES/customtkinter:customtkinter/" --copy-metadata imageio --copy-metadata docx2pdf --copy-metadata google-genai --copy-metadata pillow-heif main.py
          
      - name: Upload Mac App
        uses: actions/upload-artifact@v3
        with:
          name: SmartMF-Mac-Standalone
          path: dist/SmartMF.app
