name: Build ZipZap

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          
      - name: Build Windows Executable
        run: |
          $CTK_PATH = python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__))"
          pyinstaller --noconfirm --onefile --windowed --name "ZipZap" --add-data "$CTK_PATH;customtkinter/" --copy-metadata imageio --copy-metadata docx2pdf --copy-metadata google-genai --copy-metadata pillow-heif main.py
          
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ZipZap-Windows
          path: dist/ZipZap.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          
      - name: Build Mac App
        run: |
          CTK_PATH=$(python -c 'import customtkinter, os; print(os.path.dirname(customtkinter.__file__))')
          pyinstaller --noconfirm --windowed --name "ZipZap" --add-data "$CTK_PATH:customtkinter/" --copy-metadata imageio --copy-metadata docx2pdf --copy-metadata google-genai --copy-metadata pillow-heif main.py
          
      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: ZipZap-Mac
          path: dist/ZipZap.app
